<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado — FUNCECAIND</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .cert{max-width:760px;margin:24px auto;background:#fff;border:3px solid var(--teal-700);border-radius:8px;padding:42px 38px;text-align:center;position:relative}
  .cert::after{content:'';position:absolute;inset:10px;border:1px solid var(--teal-300);border-radius:4px;pointer-events:none}
  .cert .marca{
    width:190px;height:88px;margin:0 auto;
    background:url("assets/funcecaind/logo-funcecaind.png") center/contain no-repeat;
    overflow:hidden;text-indent:-999px;white-space:nowrap;color:transparent;
  }
  .cert .marca span{display:none}
  .cert .tipo{font-size:.8rem;letter-spacing:3px;color:var(--text-light);margin:8px 0 24px;text-transform:uppercase}
  .cert .otorga{color:var(--text-mid);font-size:.95rem}
  .cert .nombre{font-family:'Fraunces',serif;font-size:2.2rem;color:var(--text-dark);margin:8px 0;border-bottom:1px solid var(--border);display:inline-block;padding:0 24px 6px}
  .cert .curso{font-size:1.15rem;color:var(--teal-700);font-weight:600;margin:14px 0}
  .cert .pie{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;font-size:.78rem;color:var(--text-light);text-align:left}
  .cert .codigo{font-family:monospace;color:var(--text-mid)}
  .cert .detalles{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 26px;margin:18px 0 6px}
  .cert .det{font-size:.8rem;color:var(--text-light)}
  .cert .det b{display:block;color:var(--text-dark);font-size:.92rem}
  .cert #qr{display:inline-block;padding:5px;background:#fff;border:1px solid var(--border);border-radius:6px}
  .cert #qr img,.cert #qr canvas{display:block}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="brand">Funce<span>Caind</span></a>
  <div class="topbar-right"><a class="btn-logout" href="index.html">Inicio</a></div>
</div>

<div class="wrap">
  <div id="cont"><div class="empty">Cargando certificado…</div></div>
  <div style="text-align:center;margin-top:14px" id="acciones"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
var CODIGO=new URLSearchParams(location.search).get('codigo'), CERT=null, VERIFY_URL='';
function E(id){return document.getElementById(id);}

(async function(){
  if(!FV.configOk()){ E('cont').innerHTML='<div class="empty">Falta configurar Supabase.</div>'; return; }
  if(!CODIGO){ E('cont').innerHTML='<div class="empty">Certificado no especificado.</div>'; return; }
  try{
    var rows=await FV.verificarCertificado(CODIGO);
    if(!rows || !rows.length){ E('cont').innerHTML='<div class="empty">Certificado no encontrado.</div>'; return; }
    CERT=rows[0];
    var fmt=function(x){ return x ? new Date(x+'T00:00:00').toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric'}) : null; };
    var fecha=new Date(CERT.emitido_en).toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric'});
    VERIFY_URL=location.origin+location.pathname.replace('certificado.html','verificar.html')+'?codigo='+encodeURIComponent(CODIGO);
    var det='';
    if(CERT.especializacion) det+='<div class="det"><span>Especialización</span><b>'+FV.esc(CERT.especializacion)+'</b></div>';
    if(CERT.horas) det+='<div class="det"><span>Horas académicas</span><b>'+CERT.horas+' h</b></div>';
    if(CERT.fecha_inicio||CERT.fecha_fin) det+='<div class="det"><span>Período de formación</span><b>'+(fmt(CERT.fecha_inicio)||'—')+' — '+(fmt(CERT.fecha_fin)||'—')+'</b></div>';
    E('cont').innerHTML='<div class="cert">'+
      '<div class="marca">Funce<span>Caind</span></div>'+
      '<div class="tipo">Certificado de finalización</div>'+
      '<div class="otorga">Se otorga el presente certificado a</div>'+
      '<div class="nombre">'+FV.esc(CERT.alumno_nombre)+'</div>'+
      '<div class="otorga">por haber completado satisfactoriamente el curso</div>'+
      '<div class="curso">'+FV.esc(CERT.curso_titulo)+'</div>'+
      (det?'<div class="detalles">'+det+'</div>':'')+
      '<div class="pie">'+
        '<div>Fecha de emisión<br><b style="color:var(--text-mid)">'+fecha+'</b></div>'+
        '<div style="text-align:center"><div id="qr"></div><div style="font-size:.62rem;margin-top:4px">Escanea para verificar</div></div>'+
        '<div style="text-align:right">Código de verificación<br><span class="codigo">'+FV.esc(CODIGO)+'</span></div>'+
      '</div>'+
      '</div>'+
      '<p style="text-align:center;font-size:.82rem;color:var(--text-light)">Verifica la autenticidad en<br><span style="color:var(--teal-700)">'+VERIFY_URL+'</span></p>';
    try{ new QRCode(document.getElementById('qr'), {text:VERIFY_URL, width:82, height:82, correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
    E('acciones').innerHTML='<button class="btn" onclick="pdf()">⬇ Descargar PDF</button>';
  }catch(e){ E('cont').innerHTML='<div class="empty">Error: '+e.message+'</div>'; }
})();

function pdf(){
  var jsPDF=window.jspdf.jsPDF; var d=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  var W=297,H=210;
  var fmt=function(x){ return x ? new Date(x+'T00:00:00').toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; };
  d.setDrawColor(15,110,86); d.setLineWidth(2); d.rect(10,10,W-20,H-20);
  d.setLineWidth(0.4); d.rect(15,15,W-30,H-30);
  d.setFont('times','bold'); d.setTextColor(15,110,86); d.setFontSize(30); d.text('FUNCECAIND',W/2,38,{align:'center'});
  d.setFont('helvetica','normal'); d.setTextColor(120,120,120); d.setFontSize(11); d.text('CERTIFICADO DE FINALIZACIÓN',W/2,47,{align:'center'});
  d.setTextColor(80,80,80); d.setFontSize(13); d.text('Se otorga el presente certificado a',W/2,72,{align:'center'});
  d.setFont('times','bold'); d.setTextColor(6,40,32); d.setFontSize(26); d.text(CERT.alumno_nombre,W/2,88,{align:'center'});
  d.setFont('helvetica','normal'); d.setTextColor(80,80,80); d.setFontSize(13); d.text('por haber completado satisfactoriamente',W/2,101,{align:'center'});
  d.setFont('times','bold'); d.setTextColor(15,110,86); d.setFontSize(17); d.text(CERT.curso_titulo,W/2,113,{align:'center'});
  var linea=[];
  if(CERT.especializacion) linea.push('Especialización: '+CERT.especializacion);
  if(CERT.horas) linea.push(CERT.horas+' horas académicas');
  if(CERT.fecha_inicio||CERT.fecha_fin) linea.push('Del '+fmt(CERT.fecha_inicio)+' al '+fmt(CERT.fecha_fin));
  d.setFont('helvetica','normal'); d.setTextColor(90,90,90); d.setFontSize(10.5);
  if(linea.length) d.text(linea.join('    ·    '),W/2,125,{align:'center'});
  // Código QR de verificación (esquina inferior derecha)
  try{ var qc=document.querySelector('#qr canvas'); if(qc){ d.addImage(qc.toDataURL('image/png'),'PNG',W-50,152,26,26); d.setFontSize(7); d.setTextColor(120,120,120); d.text('Escanea para verificar',W-37,181,{align:'center'}); } }catch(e){}
  var fecha=new Date(CERT.emitido_en).toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric'});
  d.setFont('helvetica','normal'); d.setTextColor(110,110,110); d.setFontSize(10);
  d.text('Fecha de emisión: '+fecha,26,166); d.text('Código: '+CODIGO,26,173);
  d.setFontSize(7.5); d.text('Verifica en: '+VERIFY_URL,26,180);
  d.setFontSize(9); d.setTextColor(130,130,130); d.text('Charallave, estado Miranda · Venezuela',W/2,196,{align:'center'});
  d.save('Certificado-'+CODIGO+'.pdf');
}
</script>
</body>
</html>
