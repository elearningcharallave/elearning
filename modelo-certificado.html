<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelo de certificado — FUNCECAIND</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/styles.css"><style>

FV.requireRole(['admin','profesor'],async function(){var cont=document.getElementById('modelo'),id=new URLSearchParams(location.search).get('curso');try{if(!id)throw Error('Selecciona un curso desde su panel.');var r=await FV.sb.from('cursos').select('id,titulo,codigo_formacion,horas,duracion_texto,especializacion').eq('id',id).single();if(r.error)throw Error('No se pudo cargar este curso.');var c=r.data;cont.innerHTML='<img src="assets/funcecaind/logo-funcecaind.png" alt="FUNCECAIND"><p>PROPUESTA SIN VALIDEZ</p><h1>Certificado de formación</h1><p>Se propone otorgar a</p><h2>[Nombre del participante]</h2><p>por su participación y aprobación de</p><h2>'+FV.esc(c.titulo)+'</h2><p class="codigo">'+(c.codigo_formacion?'Código del curso: '+FV.esc(c.codigo_formacion):'Identificador interno del curso: '+FV.esc(c.id))+'</p><p>'+FV.esc(c.duracion_texto||(c.horas?c.horas+' horas':''))+'</p><p>'+FV.esc(c.especializacion||'')+'</p><p>[Lugar y fecha de emisión]</p><div class="firmas"><p>[Firma autorizada por definir]</p><p>[Docente por confirmar]</p></div><p>La referencia del curso es distinta del código único de cada certificado.</p>';}catch(e){cont.textContent=e.message;}});
</script></body></html>
